# Fabric Loom and Minecraft pins for Minecraft 26.2.
# Starting with 26.x, Minecraft itself provides official names, so no Yarn
# mappings dependency is needed.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.caching=true

minecraft_version=26.2
loader_version=0.20.0
fabric_version=0.161.0+26.2
loom_version=1.19.1

mod_version=1.0.5
maven_group=com.goggs.maneuver
archives_base_name=maneuver
java_version=25

